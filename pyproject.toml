[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-universe"
version = "0.1.0"
description = "Multi-tier research hierarchy + low-latency Trading Agent (paper trading first)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
backtest = ["vectorbt>=0.26", "pandas>=2", "numpy>=1.24", "matplotlib>=3.7"]
stocks = ["yfinance>=0.2.40"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "yfinance>=0.2.40"]
research = ["anthropic>=1.0"]
newsmodel = ["torch>=2.3", "transformers>=4.46"]  # free local news scorer (FinBERT), no API key
training = ["torch>=2.3", "transformers>=4.46", "trl>=0.19", "peft>=0.13", "datasets>=3.0", "accelerate>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
